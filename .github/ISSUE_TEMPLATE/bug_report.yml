name: Bug report
description: Report a reproducible problem in the Windows app
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.7.2-beta.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and display scale
      placeholder: Windows 11 x64, 150%, two monitors
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual behavior
      description: Use sample data and remove personal information from attachments.
    validations:
      required: true
