name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo +stable test --locked
      - name: Release build
        run: cargo +stable build --release --locked
      - name: Portable binary checks
        run: python scripts/verify-portable.py target/release/dynamic-island-for-windows.exe
      - name: Public-file audit
        run: python scripts/audit-public.py --tracked
