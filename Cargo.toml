[package]
name = "dynamic-island-for-windows"
version = "0.7.2-beta.1"
edition = "2024"
description = "A small, local-first Dynamic Island companion for Windows"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-collections = "=0.3.2"
windows-core = "=0.62.2"
windows-numerics = "=0.3.1"
windows = { version = "=0.62.2", features = [
  "Foundation", "Foundation_Collections", "Devices_Enumeration", "Media_Control",
  "Storage_Streams", "Win32_Foundation", "Win32_Devices_FunctionDiscovery", "Win32_Storage_FileSystem",
  "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Networking_WinHttp", "Win32_Media_Audio",
  "Win32_Media_Multimedia", "Win32_Security", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader",
  "Win32_System_Power", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_WinRT", "Win32_System_Variant", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_Graphics_Dwm"
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
